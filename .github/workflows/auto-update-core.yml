name: Auto Update Cores

on:
  schedule:
    - cron: '30 2 * * *' # 每天 UTC 02:30 (北京时间 10:30) 执行
  workflow_dispatch:

jobs:
  update-cores:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
        with:
          ref: dev_new
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check and Update go.mod
        run: |
          # 启用 GOPROXY
          go env -w GOPROXY=https://goproxy.cn,direct
          export GOEXPERIMENT=jsonv2
          TAGS="sing xray hysteria2 with_quic with_grpc with_utls with_wireguard with_acme with_gvisor"

          # 三个内核逐个升级，每升一个就编译一次，编不过只回滚那一个。
          #
          # 旧写法是三个一起升、失败时只会回滚 hysteria。2026-09-24 wyx2685/xray-core
          # 合并上游时漏改了自家的 TUIC 传输（引用了上游已删除的
          # MemoryStreamConfig.UdpmaskManager），fork 的 HEAD 本身就编不过；
          # 回滚完 hysteria 还是编不过，整个任务失败，连带本来没问题的
          # hysteria 2.12.3 也升不上去。上游哪个坏了就跳过哪个，其余照常。

          mod_version() {
            # 直接读 go.mod 文本。不能用 go list -m：它默认 -mod=readonly，
            # go.mod 需要 tidy 时会直接报错；在 bash -e 下整个任务就挂了。
            grep -E "^[[:space:]]*$(echo "$1" | sed 's/\./\\./g')[[:space:]]+v" go.mod \
              | awk '{print $2}' | head -1
          }
          replace_target() {
            grep -E "^replace $(echo "$1" | sed 's/\./\\./g') " go.mod | awk '{print $NF}'
          }
          build_ok() {
            go build -o /dev/null -tags "$TAGS" . 2>&1 | tail -20
            return "${PIPESTATUS[0]}"
          }

          # xray-core 和 hysteria 都直接使用 apernet/quic-go 的扩展字段，两边要求的
          # 版本必须同时满足。不能「无条件对齐到 xray 声明的版本」——hysteria 要求
          # 更高时 go get 会连带把 hysteria 降级（提交 d0d92aa 就是这么退回 2.9.2 的）。
          # 让 MVS 自己算：去掉强制 pin，tidy 后取各方要求的最大值，再钉回去。
          align_quic() {
            go mod edit -dropreplace=github.com/apernet/quic-go && go mod tidy || return 1
            local v
            v=$(go list -m -f '{{.Version}}' github.com/apernet/quic-go) || return 1
            [ -n "$v" ] || return 1
            go mod edit -replace="github.com/apernet/quic-go=github.com/apernet/quic-go@${v}" && go mod tidy
          }

          # 改动前必须能编过，否则后面的「编不过就回滚」没有意义。
          echo "::group::Baseline build"
          if ! build_ok; then
            echo "::error::dev_new 当前的 go.mod 本身就编译失败，先修主分支再自动更新"
            exit 1
          fi
          echo "::endgroup::"

          BEFORE_HY_CORE=$(mod_version github.com/apernet/hysteria/core/v2)
          BEFORE_HY_EXTRAS=$(mod_version github.com/apernet/hysteria/extras/v2)

          UPDATED=""; SKIPPED=""
          # try_update <名字> <升级命令>：先快照 go.mod/go.sum，升级 + 对齐 quic-go +
          # 编译，任何一步失败都恢复快照，并记下被跳过的内核。
          # 这些函数都在 if 条件里执行，bash -e 在那里不生效，所以函数内部一律用 && 串联。
          try_update() {
            local name="$1"; shift
            echo "::group::Update $name"
            cp go.mod go.mod.ok; cp go.sum go.sum.ok
            if "$@" && align_quic && build_ok; then
              if cmp -s go.mod go.mod.ok; then
                echo "$name: 已是最新"
              else
                echo "$name: 已升级并通过编译"
                UPDATED="$UPDATED $name"
              fi
            else
              echo "::warning::$name 的最新上游无法与当前代码一起编译，本次跳过（保持原版本）"
              cp go.mod.ok go.mod; cp go.sum.ok go.sum
              SKIPPED="$SKIPPED $name"
            fi
            rm -f go.mod.ok go.sum.ok
            echo "::endgroup::"
          }

          up_xray() {
            go mod edit -replace=github.com/xtls/xray-core=github.com/wyx2685/xray-core@main && go mod tidy
          }
          up_sing() {
            go mod edit -replace=github.com/sagernet/sing-box=github.com/wyx2685/sing-box_mod@dev-next && go mod tidy
          }
          up_hysteria() {
            local core extras
            core=$(go list -m -versions github.com/apernet/hysteria/core/v2 | tr ' ' '\n' | tail -1)
            extras=$(go list -m -versions github.com/apernet/hysteria/extras/v2 | tr ' ' '\n' | tail -1)
            [ -n "$core" ] && [ -n "$extras" ] || return 1
            echo "Latest hysteria: core=$core extras=$extras"
            go get "github.com/apernet/hysteria/core/v2@${core}" "github.com/apernet/hysteria/extras/v2@${extras}" && go mod tidy
          }

          # 只有 go.mod 里确实有 replace 的内核才走 fork 分支升级。
          [ -n "$(replace_target github.com/xtls/xray-core)" ] && try_update xray-core up_xray
          [ -n "$(replace_target github.com/sagernet/sing-box)" ] && try_update sing-box up_sing
          try_update hysteria up_hysteria

          # 降级守卫。自动更新只应该往前走；一旦发现内核版本倒退就让任务失败，
          # 而不是安安静静地把降级提交上去（d0d92aa 的教训）。
          ver_rank() {
            go list -m -versions "$1" 2>/dev/null | tr ' ' '\n' | grep -n "^$2$" | cut -d: -f1
          }
          # 查不到版本号（网络抖动、伪版本不在 tag 列表里）只提示，不判失败。
          for pair in "github.com/apernet/hysteria/core/v2:$BEFORE_HY_CORE" \
                      "github.com/apernet/hysteria/extras/v2:$BEFORE_HY_EXTRAS"; do
            mod="${pair%:*}"; before="${pair##*:}"
            after=$(mod_version "$mod")
            [ "$after" = "$before" ] && continue
            rb=$(ver_rank "$mod" "$before"); ra=$(ver_rank "$mod" "$after")
            if [ -n "$rb" ] && [ -n "$ra" ] && [ "$ra" -lt "$rb" ]; then
              echo "::error::$mod 从 $before 被降级到 $after，依赖对齐环节有问题，已中止"
              exit 1
            fi
            echo "$mod: $before -> $after"
          done

          {
            echo "## 内核自动更新"
            echo "- 已升级：${UPDATED:- 无}"
            echo "- 上游编译失败、已跳过：${SKIPPED:- 无}"
          } >> "$GITHUB_STEP_SUMMARY"

          if git diff --quiet go.mod go.sum; then
            echo "No updates available for kernels."
            echo "CHANGED=false" >> $GITHUB_ENV
          else
            echo "Kernel updates found:$UPDATED"
            echo "CHANGED=true" >> $GITHUB_ENV
            echo "UPDATED_CORES=$(echo $UPDATED | tr ' ' '/')" >> $GITHUB_ENV
            grep -E "hysteria|replace" go.mod
          fi

      - name: Commit and Create Release
        if: env.CHANGED == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 提交依赖更新
          git add go.mod go.sum
          git commit -m "build(deps): auto-update core dependencies (${UPDATED_CORES})"

          # 推送到 dev_new
          git push origin dev_new

          # 触发 Release.yml 中的构建和发布流程
          echo "Triggering Build and Release workflow..."
          gh workflow run release.yml --ref dev_new
          
          # 触发 Docker 分发流程
          echo "Triggering Docker Publish workflow..."
          gh workflow run "Publish Docker image.yml" --ref dev_new
