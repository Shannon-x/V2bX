name: Secret scan

# Fails when a new commit adds a credential (rules: .gitleaks.toml).
# Only the commits being pushed / proposed are scanned: secrets that already sit
# in history cannot be removed from a public repo and must be rotated instead.

on:
  pull_request:
  push:
    branches: [dev_new, master, main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz

      - name: Scan new commits
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            RANGE="${BASE_SHA}..${HEAD_SHA}"
          else
            # New branch or force push without a usable base: scan the head commit only.
            RANGE="${HEAD_SHA}~1..${HEAD_SHA}"
          fi
          echo "Scanning ${RANGE}"
          gitleaks git --config .gitleaks.toml --log-opts="${RANGE}" --redact --verbose --exit-code 1
